<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="Toy Haven checkout">
    <title>Toy Haven - Checkout</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png">
    <link rel="manifest" href="manifest.json">
</head>
<body>
<header>
    <nav>
        <h1 class="logo">
            <a href="index.html">Toy Haven</a>
        </h1>
        <button
            class="menu-button"
            id="menuButton"
            aria-label="Open navigation menu">
            ☰
        </button>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="feedback.html">Feedback</a>
        </div>
    </nav>
</header>
<main>
    <section class="checkout-section">
        <h1>Checkout</h1>
        <div class="order-summary">
            <h2>Order Summary</h2>
            <div id="checkoutItems"></div>
            <h3>
                Final Total:
                Rs. <span id="checkoutTotal">0</span>
            </h3>
        </div>
        <form id="checkoutForm">
            <label for="customerName">
                Full Name
            </label>
            <input
                type="text"
                id="customerName"
                required>
            <label for="customerEmail">
                Email
            </label>
            <input
                type="email"
                id="customerEmail"
                required>
            <label for="customerAddress">
                Delivery Address
            </label>
            <textarea
                id="customerAddress"
                required>
            </textarea>
            <label for="paymentMethod">
                Payment Method
            </label>
            <select
                id="paymentMethod"
                required>
                <option value="">
                    Select Payment Method
                </option>
                <option value="Card">
                    Card
                </option>
                <option value="Cash on Delivery">
                    Cash on Delivery
                </option>
            </select>
            <button
                type="submit"
                class="main-button">
                Confirm Order
            </button>
        </form>
        <div
            id="successMessage"
            class="success-message">
            ✓ Order placed successfully!
        </div>
    </section>
</main>
<footer>
    <h2>Toy Haven</h2>
    <p>
        Your one-stop shop for all things fun and playful.
    </p>
    <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="wishlist.html">Wishlist</a>
        <a href="feedback.html">Feedback</a>
    </div>
    <p>
        &copy; 2026 Toy Haven. All rights reserved.
    </p>
</footer>
<script src="script.js"></script>
</body>
</html>
