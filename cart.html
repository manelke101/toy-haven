<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Toy Haven shopping cart">

    <title>Toy Haven - Cart</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" href="favicon.png">

    <link rel="manifest" href="manifest.json">

</head>


<body>


<header>
    <nav>
        <h1 class="logo">
            <a href="index.html">Toy Haven</a>
        </h1>
        <button
            class="menu-button"
            id="menuButton"
            aria-label="Open navigation menu">
            ☰
        </button>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="feedback.html">Feedback</a>
        </div>
    </nav>
</header>
<main>
    <section class="cart-section">
        <h1>Your Shopping Cart</h1>
        <div id="cartItems"></div>
        <div class="cart-summary">
            <h2>
                Total:
                Rs. <span id="cartTotal">0</span>
            </h2>
            <button
                id="clearCartBtn"
                class="secondary-button">
                Clear Cart
            </button>
            <a
                href="checkout.html"
                class="main-button">
                Proceed to Checkout
            </a>
        </div>
    </section>
</main>
<footer>
    <h2>Toy Haven</h2>
    <p>
        Your one-stop shop for all things fun and playful.
    </p>
    <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="wishlist.html">Wishlist</a>
        <a href="feedback.html">Feedback</a>
    </div>
    <div class="newsletter">
        <h3>Subscribe to our Newsletter</h3>
        <form id="newsletterForm">
            <input
                type="email"
                id="newsletterEmail"
                placeholder="Enter your email"
                required>
            <button type="submit">
                Subscribe
            </button>
        </form>
    </div>
    <p>
        &copy; 2026 Toy Haven. All rights reserved.
    </p>
</footer>
<script src="script.js"></script>
</body>
</html>
