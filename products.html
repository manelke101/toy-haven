<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Browse Toy Haven products">

    <title>Toy Haven - Products</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" href="favicon.png">

    <link rel="manifest" href="manifest.json">

</head>


<body>
<header>
    <nav>
        <h1 class="logo">
            <a href="index.html">Toy Haven</a>
        </h1>
        <button
            class="menu-button"
            id="menuButton"
            aria-label="Open navigation menu">
            ☰
        </button>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="feedback.html">Feedback</a>
        </div>
    </nav>
</header>
<main>
    <section class="products-section">
        <h1>Our Products</h1>
        <p>
            Explore our collection of toys and games.
        </p>
        <div class="product-controls">
            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
                aria-label="Search products">
            <select
                id="categoryFilter"
                aria-label="Filter products by category">
                <option value="all">
                    All Categories
                </option>
                <option value="Figurines">
                    Figurines
                </option>
                <option value="Toys">
                    Toys
                </option>
                <option value="Board Games">
                    Board Games
                </option>
                <option value="Diecast Cars">
                    Diecast Cars
                </option>
            </select>
        </div>
        <div
            class="product-grid"
            id="productGrid">
        </div>
    </section>
</main>
<div
    id="productModal" class="modal">
    <div class="modal-content">
        <button
            class="close-modal" id="closeModal" aria-label="Close product details"> × </button>
        <img
            id="modalImage"
            src="images/toy-car.png"
            alt="Selected product">
        <h2 id="modalName">
            Product Details
        </h2>
        <p id="modalCategory"> </p>
        <p id="modalPrice"> </p>
    </div>
</div>
<footer>
    <h2>Toy Haven</h2>
    <p>
        Your one-stop shop for all things fun and playful.
    </p>
    <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="wishlist.html">Wishlist</a>
        <a href="feedback.html">Feedback</a>
    </div>
    <div class="newsletter">
        <h3>Subscribe to our Newsletter</h3>
        <form id="newsletterForm">
            <input
                type="email"
                id="newsletterEmail"
                placeholder="Enter your email"
                required>
            <button type="submit">
                Subscribe
            </button>
        </form>
    </div>
    <p>
        &copy; 2026 Toy Haven. All rights reserved.
    </p>
</footer>
<script src="script.js"></script>
</body>
</html>
